[Service]
# Single core, and more tools are coming. Ceilings (MemoryMax/TasksMax/
# CPUQuota) stay as set by the base unit - already modest. This layers
# *relative* priority so the observer yields under real contention instead
# of competing evenly with the bot or whatever gets added next.
Nice=10
CPUWeight=20
IOSchedulingClass=best-effort
IOSchedulingPriority=7
